# ==============================================================================
# Zelo - Docker Compose para Desenvolvimento (Hot Reload + Volume Mount)
# Uso: docker compose -f docker-compose.dev.yml up
# ==============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: zelo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zelo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zelo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zelo-dev-network

  app:
    image: node:20-alpine
    container_name: zelo-app-dev
    working_dir: /app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-zelo}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-zelo}?schema=public
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000}
      - JWT_SECRET=${JWT_SECRET:-zelo-dev-jwt-secret-key-1234567890}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npm install -g pnpm && pnpm install && npx prisma generate && pnpm dev"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zelo-dev-network

volumes:
  postgres_dev_data:
    name: zelo_postgres_dev_data

networks:
  zelo-dev-network:
    name: zelo-dev-network
    driver: bridge
